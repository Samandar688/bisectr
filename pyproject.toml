[project]
name = "bisectr"
version = "0.1.0"
description = "Find the commit that broke your code with binary search over git history, and watch it happen"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
bisectr = "bisectr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
bench = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bisectr"]

[tool.setuptools.package-data]
bisectr = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
