name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,bench]" pytest-github-actions-annotate-failures  # failed tests show up as annotations
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (with a small demo repo)
        run: docker build --build-arg COMMITS=200 -t bisectr .
      - name: Start it and check the API answers
        run: |
          docker run -d -p 8000:8000 --name bisectr bisectr
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/repo > /dev/null && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/bisect | head -c 300
          docker logs bisectr
